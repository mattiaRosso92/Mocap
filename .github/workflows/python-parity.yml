name: MATLAB and Python parity

on:
  push:
    paths: ['FREQNESS_Mocap_Toolbox/**', '.github/workflows/**']
  pull_request:
    paths: ['FREQNESS_Mocap_Toolbox/**', '.github/workflows/**']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install './FREQNESS_Mocap_Toolbox/python[test]' build
      - run: python -m pytest FREQNESS_Mocap_Toolbox/python/tests/test_toolbox.py
      - run: python -m build FREQNESS_Mocap_Toolbox/python

  matlab-reference:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      FREQNESS_MATLAB_REFERENCE: ${{ github.workspace }}/matlab_reference.mat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Signal_Processing_Toolbox Statistics_and_Machine_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath('FREQNESS_Mocap_Toolbox/python/tests');
            generate_matlab_reference(getenv('FREQNESS_MATLAB_REFERENCE'));
            set(groot,'DefaultFigureVisible','off');
            results=runtests('FREQNESS_Mocap_Toolbox/tests'); assertSuccess(results);
      - run: python -m pip install './FREQNESS_Mocap_Toolbox/python[test]'
      - name: Require a real MATLAB reference before checking parity
        run: python -c "import os,pathlib; assert pathlib.Path(os.environ['FREQNESS_MATLAB_REFERENCE']).is_file()"
      - run: python -m pytest FREQNESS_Mocap_Toolbox/python/tests
