name: Package FREQ-NESS MoCap release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/python-parity.yml
  package:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - name: Build the toolbox-only archive and Python distributions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python FREQNESS_Mocap_Toolbox/python/tools/package_release.py --tag "$RELEASE_TAG" --output dist/FREQNESS_Mocap.zip
          python -m build FREQNESS_Mocap_Toolbox/python --outdir dist
      - name: Attach validated files to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/FREQNESS_Mocap.zip dist/*.whl dist/*.tar.gz
